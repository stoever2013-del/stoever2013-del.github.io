<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-CdAsKd64rxsCte1UWN9IGwuK/GKhZuD52kc1vEVZj2w='; style-src 'unsafe-inline' https://fonts.googleapis.com; img-src data:; font-src https://fonts.gstatic.com; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">

<title>Frigobar Naran</title>

<style>
:root{--bg:#EFE8DA;--card:#FBF7EF;--ink:#2F3626;--muted:#6F7A5E;--accent:#5E6B45;--warm:#B8664A;--line:#DDD3BF;--onaccent:#FBF7EF;color-scheme:light;--display:"Cormorant Garamond",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 140px max(16px,env(safe-area-inset-left))}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:500 44px/1 var(--display);margin:0;color:var(--accent)}
.sub{color:var(--muted);margin:0;font-size:14px}
.chip{font:600 12px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line)}
.zona{font:italic 500 30px/1.1 var(--display);color:var(--accent);margin:22px 0 2px;scroll-margin-top:60px}
.zona small{display:block;font:600 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
section{padding:10px 0 4px;scroll-margin-top:60px}
h2{font:italic 500 22px var(--display);margin:0 0 4px;color:var(--warm)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:8px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;background:#fff}
.card .cb{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-size:14px;line-height:1.25}.card .note{font-size:11.5px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.card .qty{gap:4px}.card .qty button{width:32px;height:32px}
.item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.n{min-width:0}.name{font-weight:600}.note{font-size:12.5px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warm);margin-left:6px}
.price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);white-space:nowrap}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.qty .add{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:20}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.total small{display:block;color:var(--muted);font-size:12px}.total b{font-size:22px;font-variant-numeric:tabular-nums}
.cta{font:700 15px var(--body);background:var(--accent);color:var(--onaccent);border:0;border-radius:12px;padding:13px 20px;cursor:pointer}
.cta:disabled{opacity:.4;cursor:default}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.panel h3{font:500 28px var(--display);margin:0;color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.lines div{display:flex;justify-content:space-between;gap:12px}.lines .sum{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:17px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay{text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px}
.pay b{font-size:14px}.pay span{font-size:11.5px;color:var(--muted)}
.pay[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.info{background:var(--bg);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.bank-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.bank-value{min-width:0;overflow-wrap:anywhere}.bank-value b{display:block;user-select:all}
.copy{flex:none;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--accent);font:600 12px var(--body);cursor:pointer}
.copy-status{min-height:1.45em;color:var(--muted);font-size:13px}
.close{align-self:flex-end;background:none;border:0;color:var(--muted);font:600 13px var(--body);cursor:pointer}
.done{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px 0}
@media (max-width:380px){.pays{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style></head>

var lang=(navigator.language||'es').toLowerCase().indexOf('es')===0?'es':'en', pay='airbnb', cart={};

function eh(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function fmt(n){return '$'+n.toLocaleString('es-MX')}
function all(){var a=[];D.cat.forEach(function(c){a=a.concat(c.items)});return a}
function render(){
  var L=T[lang];document.documentElement.lang=lang;
  $('sub').textContent=L.sub;$('lang').textContent=L.lang;$('x').textContent=L.close;
  if($('disponibilidad'))$('disponibilidad').textContent=lang==='es'?'Menú en preparación. Confirma los productos disponibles en el departamento.':'Menu in preparation. Check the available products in the apartment.';
  $('nav').innerHTML='<a href="#frigobar">'+L.fr[0]+'</a><a href="#despensa">'+L.dp[0]+'</a>'+D.cat.map(function(c){return '<a href="#'+c.id+'">'+c[lang]+'</a>'}).join('');
  var html='',zona='';

    if(c.seccion!==zona){zona=c.seccion;var z=L[zona==='frigobar'?'fr':'dp'];html+='<h2 class="zona" id="'+zona+'">'+z[0]+'<small>'+z[1]+'</small></h2>'}
    var conF=c.items.filter(function(i){return i.img}),sinF=c.items.filter(function(i){return !i.img});
    html+='<section id="'+c.id+'"><h2>'+c[lang]+'</h2>'+(conF.length?'<div class="cards">'+conF.map(function(i){

      var q=cart[i.id]||0,name=eh(lang==='es'?i.es:i.en),note=eh(lang==='es'?i.nes:i.nen),itemId=eh(i.id);

  $('menu').innerHTML=html;bar();
}
function totals(){var n=0,s=0;all().forEach(function(i){var q=cart[i.id]||0;n+=q;s+=q*i.p});return{n:n,s:s}}

document.addEventListener('click',function(e){
  var p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');
  if(p){cart[p.dataset.p]=(cart[p.dataset.p]||0)+1;render()}

});
function sheet(){

async function copiarDato(b){

}
