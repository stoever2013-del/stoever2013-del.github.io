<style>
:root{--fondo:#000000;--fondo2:#0a0a0b;--papel:#161617;--tinta:#f5f5f7;--tinta2:#a1a1a6;--acento:#23784b;--acento2:#7fd1a0;--linea:#2a2a2d;--ok:#4cc38a;--warn:#c9894a;--bad:#ff6b60;--display:-apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif;--cuerpo:-apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;--u:8px;--radio:16px;--radio-chico:12px;color-scheme:dark;}

.pill{font:500 13px var(--cuerpo);min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--linea);background:transparent;color:var(--tinta);cursor:pointer}

.estancia .monto{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

section{scroll-margin-top:64px;padding-top:8px}

.nombre{font-weight:600;font-size:15px;line-height:1.25}
.nota{font-size:12.5px;color:var(--tinta2)}

.item+.item{border-top:1px solid var(--linea)}
.n{min-width:0}
.qty{display:flex;align-items:center;gap:4px}

.cta:disabled{opacity:.35;cursor:default}
.cta.sec{background:var(--fondo2);color:var(--tinta)}

.sheet[hidden]{display:none}

.cab{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel h3{font:600 24px var(--display);letter-spacing:-.02em;margin:0}
.cerrar{width:32px;height:32px;border-radius:50%;border:0;background:var(--fondo2);color:var(--tinta2);display:grid;place-items:center;cursor:pointer}
.explica{margin:0;color:var(--tinta2);font-size:14px}
.grupo{background:var(--fondo2);border-radius:var(--radio-chico);overflow:hidden}
.ln{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;font-variant-numeric:tabular-nums}
.ln+.ln{border-top:1px solid var(--linea)}
.ln .que{min-width:0}.ln .que small{display:block;color:var(--tinta2);font-size:12px}
.ln .der{display:flex;align-items:center;gap:10px}
.cupon{width:100%;text-align:left;font:inherit;color:var(--tinta);display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radio-chico);border:1px solid var(--linea);background:transparent;cursor:pointer;min-height:56px}
.cupon .chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tinta2);display:grid;place-items:center;color:transparent}
.cupon[aria-checked="true"]{border-color:var(--acento2)}

.cupon .ctx{flex:1;min-width:0}.cupon .ctx small{display:block;color:var(--tinta2);font-size:12px}
.cupon .menos{font-weight:600;color:var(--acento2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sumas{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}

.sumas .t{border-top:1px solid var(--linea);padding-top:10px;font-weight:600;font-size:18px}
.paga{margin-top:8px;font-weight:600;font-size:15px}
.sumas .pend{justify-content:flex-start;align-items:center;gap:6px;color:var(--tinta2);font-size:12.5px;margin-top:-2px}.sumas .pend svg{flex:none}

.bank-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.copy{flex:none;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--linea);color:var(--tinta);font:500 13px var(--cuerpo);cursor:pointer}
.copy-status{min-height:1.4em;color:var(--tinta2);font-size:13px}
.vacio{color:var(--tinta2);text-align:center;padding:18px 0;margin:0}
.previas summary{cursor:pointer;color:var(--tinta2);font-size:14px;min-height:44px;display:flex;align-items:center}

}
function bar(){var L=T[lang],b=bagTot(),c=cuentas(actual(false));
  if(b.n){$('cnt').textContent=L.bolsa(b.n);$('tot').textContent=fmt(b.s);$('go').textContent=L.agregar;$('go').className='cta';$('go').disabled=false}
  else{$('cnt').textContent=c.n?L.cuentaN(c.n):L.vacia;$('tot').textContent=fmt(c.t);$('go').textContent=L.ver;$('go').className='cta sec';$('go').disabled=false}}
function aviso(t){var a=$('aviso');a.textContent=t;a.className='aviso on';clearTimeout(aviso.t);aviso.t=setTimeout(function(){a.className='aviso'},1800)}
function agregarBolsa(){var e=actual(true),ts=Date.now();Object.keys(bag).forEach(function(k){var i=byId(k);if(i&&bag[k]>0)e.lineas.push({item:i.id,es:i.es,en:i.en,p:i.p,n:bag[k],ts:ts})});e.ultima=ts;bag={};guardar();render();aviso(T[lang].agregado)}
function quitarUno(id){var e=actual(false);if(!e)return;for(var j=e.lineas.length-1;j>=0;j--){if(e.lineas[j].item===id){e.lineas[j].n--;if(e.lineas[j].n<=0)e.lineas.splice(j,1);break}}e.ultima=Date.now();guardar();hoja();render()}
function fecha(ts){try{return new Date(ts).toLocaleDateString(lang==='es'?'es-MX':'en-US',{day:'numeric',month:'short'})}catch(e){return ''}}
function hoja(){var av=$('aviso');av.className='aviso';
  var L=T[lang],e=actual(false),c=cuentas(e);if(e)pay=e.pago||pay;
  var lineas=c.g.length?'<div class="grupo">'+c.g.map(function(g){var nm=eh(lang==='es'?g.es:g.en);return '<div class="ln"><div class="que">'+g.n+' × '+nm+'</div><div class="der"><span>'+fmt(g.s)+'</span><button type="button" class="cerrar" aria-label="'+L.quitar+' '+nm+'" data-q="'+eh(g.item)+'">'+SVG.menos+'</button></div></div>'}).join('')+'</div>':'<p class="vacio">'+L.sinNada+'</p>';
  var cup=P.promo&&c.n?'<button type="button" class="cupon" role="switch" aria-checked="'+(!!(e&&e.resena))+'" id="cupon"><span class="chk">'+SVG.ok+'</span><span class="ctx">'+L.cupon[0]+'<small>'+L.cupon[1]+'</small></span><span class="menos">−'+fmt(P.promo)+'</span></button>':'';
  var sumas=c.n?'<div class="sumas"><div><span>'+L.sub2+'</span><span>'+fmt(c.s)+'</span></div>'+(c.d?'<div class="d"><span>'+L.desc+'</span><span>−'+fmt(c.d)+'</span></div><div class="pend">'+SVG.reloj+'<span>'+L.pend+'</span></div>':'')+'<div class="t"><span>'+L.total+'</span><span>'+fmt(c.t)+'</span></div></div>':'';
  var pagos=c.n?'<div class="paga">'+L.how+'</div><div class="seg">'+['airbnb','cash','xfer'].map(function(k){return '<button type="button" data-pay="'+k+'" aria-pressed="'+(pay===k)+'">'+L[k]+'</button>'}).join('')+'</div><div class="info">'+(pay==='airbnb'?L.iAirbnb:pay==='cash'?L.iCash:L.iXfer)+'</div>':'';
  var prev=S.estancias.filter(function(x){return x!==e&&x.lineas.length});
  var previas=prev.length?'<details class="previas"><summary>'+L.previas+'</summary><div class="grupo">'+prev.slice().reverse().map(function(x){var k=cuentas(x);return '<div class="ln"><div class="que">'+fecha(x.inicio)+' – '+fecha(x.ultima)+'<small>'+L.cuentaN(k.n)+'</small></div><span>'+fmt(k.t)+'</span></div>'}).join('')+'</div></details>':'';
  $('sb').innerHTML='<div class="asa"></div><div class="cab"><h3 id="sh-t">'+L.titulo+'</h3><button type="button" class="cerrar" id="x" aria-label="'+L.cerrar+'">'+SVG.x+'</button></div><p class="explica">'+L.explica+'</p>'+(guardaOK?'':'<p class="explica">'+L.sinGuardar+'</p>')+lineas+cup+sumas+pagos+(c.n?'<button type="button" class="cta" id="ok">'+L.listo+'</button>':'')+previas;
  $('sb').querySelectorAll('[data-cuenta]').forEach(function(el){var i=+el.dataset.cuenta;el.textContent=D.pago[i];var b=document.createElement('button');b.type='button';b.className='copy';b.dataset.copy=i;b.textContent=L.copy;b.setAttribute('aria-label',L.copy+' '+L.copyLabels[i]);el.parentNode.parentNode.appendChild(b)});
  if(pay==='xfer'&&c.n){var st=document.createElement('div');st.id='copy-status';st.className='copy-status';st.setAttribute('role','status');st.setAttribute('aria-live','polite');$('sb').querySelector('.info').appendChild(st)}
  $('sheet').hidden=false;
}
async function copiarDato(b){var i=Number(b.dataset.copy),L=T[lang];if(!Number.isInteger(i)||i<0||i>2)return;var v=D.pago[i],ok=false;b.disabled=true;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(v);ok=true}}catch(e){}
  if(!ok){var f=document.createElement('textarea');f.value=v;f.readOnly=true;f.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px';document.body.appendChild(f);try{f.focus();f.select();f.setSelectionRange(0,v.length);ok=document.execCommand('copy')===true}catch(e){}finally{f.remove();b.focus()}}
  b.disabled=false;if(!b.isConnected)return;b.textContent=ok?L.copied:L.copy;var st=$('copy-status');if(st)st.textContent=ok?L.copyOK:L.copyFail;if(ok)setTimeout(function(){if(b.isConnected)b.textContent=T[lang].copy},2000)}
document.addEventListener('click',function(ev){var p=ev.target.closest('[data-p]'),m=ev.target.closest('[data-m]');
  if(p&&!p.closest('#sheet')){bag[p.dataset.p]=(bag[p.dataset.p]||0)+1;render()}
  if(m&&!m.closest('#sheet')){bag[m.dataset.m]--;if(!bag[m.dataset.m])delete bag[m.dataset.m];render()}});
$('go').onclick=function(){if(bagTot().n)agregarBolsa();else hoja()};
$('estancia').onclick=hoja;
$('lang').onclick=function(){lang=lang==='es'?'en':'es';render()};
$('sheet').addEventListener('click',function(ev){
  if(ev.target.id==='sheet'||ev.target.closest('#x')||ev.target.closest('#ok')){$('sheet').hidden=true;return}
  var b=ev.target.closest('[data-pay]');if(b){pay=b.dataset.pay;var e=actual(false);if(e){e.pago=pay;guardar()}hoja();return}
  var q=ev.target.closest('[data-q]');if(q){quitarUno(q.dataset.q);return}
  if(ev.target.closest('#cupon')){var e2=actual(false);if(e2){e2.resena=!e2.resena;e2.ultima=Date.now();guardar();hoja();render()}return}
  var cp=ev.target.closest('[data-copy]');if(cp){copiarDato(cp)}});
render();
if(location.hash){var z=document.getElementById(location.hash.slice(1));if(z)setTimeout(function(){z.scrollIntoView()},50)}
</script>
</body></html>
