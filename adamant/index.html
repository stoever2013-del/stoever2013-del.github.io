<style>

.bank-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.bank-value{min-width:0;overflow-wrap:anywhere}.bank-value b{display:block;user-select:all}
.copy{flex:none;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--accent);font:600 12px var(--body);cursor:pointer}

.close{align-self:flex-end;background:none;border:0;color:var(--muted);font:600 13px var(--body);cursor:pointer}
.done{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px 0}
@media (max-width:380px){.pays{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style></head>

var T={
 es:{sub:'Toma lo que se te antoje y anótalo aquí. Al final pagas como prefieras.',cnt:function(n){return 'Tu cuenta · '+n+' producto'+(n===1?'':'s')},go:'Ver mi cuenta',close:'Cerrar',lang:'English',
  fr:['Frigobar','En el refri'],dp:['Despensa','Snacks, dulces y bienestar'],
  title:'Tu cuenta',how:'¿Cómo quieres pagar?',total:'Total',
  airbnb:['Por Airbnb','Llega a tu app'],cash:['Efectivo','En el depto'],xfer:['Transferencia','Cuenta para pagar'],
  iAirbnb:'Te enviamos la solicitud de pago por Airbnb después de tu salida y la aceptas en la app. No tienes que hacer nada más.',
  iCash:'Deja el efectivo en el sobre que está junto al QR del frigobar (si no lo ves, sobre la barra de la cocina). Lo recibimos en la limpieza.',
  iXfer:'<div class="bank-row"><span class="bank-value">Nombre completo<b data-cuenta="0"></b></span></div><div class="bank-row"><span class="bank-value">Banco<b data-cuenta="1"></b></span></div><div class="bank-row"><span class="bank-value">Cuenta para transferencia<b data-cuenta="2"></b></span></div>',
  copy:'Copiar',copied:'Copiado',copyLabels:['nombre completo','banco','cuenta para transferencia'],copyOK:'Copiado. Ya puedes pegarlo en tu app del banco.',copyFail:'No se pudo copiar. Mantén pulsado el dato para seleccionarlo y copiarlo.',
  confirm:'Listo',ok:'¡Gracias!',okTxt:'Disfrútalo. Al hacer la limpieza revisamos el frigobar y te confirmamos el total por Airbnb.',top:'favorito',combo:'combo'},
 en:{sub:'Help yourself and tap what you take. Pay at the end however you like.',cnt:function(n){return 'Your tab · '+n+' item'+(n===1?'':'s')},go:'View my tab',close:'Close',lang:'Español',
  fr:['Minibar','In the fridge'],dp:['Pantry','Snacks, sweets and wellness'],
  title:'Your tab',how:'How would you like to pay?',total:'Total',
  airbnb:['Through Airbnb','Arrives in your app'],cash:['Cash','In the apartment'],xfer:['Bank transfer','Account details'],
  iAirbnb:'We send the payment request through Airbnb after check-out and you accept it in the app. Nothing else to do.',
  iCash:'Leave the cash in the envelope next to the minibar QR (if you don’t see it, on the kitchen counter). We collect it during cleaning.',
  iXfer:'<div class="bank-row"><span class="bank-value">Full name<b data-cuenta="0"></b></span></div><div class="bank-row"><span class="bank-value">Bank<b data-cuenta="1"></b></span></div><div class="bank-row"><span class="bank-value">Transfer account<b data-cuenta="2"></b></span></div>',
  copy:'Copy',copied:'Copied',copyLabels:['full name','bank','transfer account'],copyOK:'Copied. You can paste it into your banking app.',copyFail:'Could not copy. Press and hold the detail to select and copy it.',
  confirm:'Done',ok:'Thank you!',okTxt:'Enjoy. We check the minibar during cleaning and confirm the total through Airbnb.',top:'favorite',combo:'combo'}
};
var lang=(navigator.language||'es').toLowerCase().indexOf('es')===0?'es':'en', pay='airbnb', cart={};
function $(i){return document.getElementById(i)}
function eh(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function fmt(n){return '$'+n.toLocaleString('es-MX')}
function all(){var a=[];D.cat.forEach(function(c){a=a.concat(c.items)});return a}
function render(){
  var L=T[lang];document.documentElement.lang=lang;
  $('sub').textContent=L.sub;$('lang').textContent=L.lang;$('x').textContent=L.close;
  if($('disponibilidad'))$('disponibilidad').textContent=lang==='es'?'Menú en preparación. Confirma los productos disponibles en el departamento.':'Menu in preparation. Check the available products in the apartment.';
  $('nav').innerHTML='<a href="#frigobar">'+L.fr[0]+'</a><a href="#despensa">'+L.dp[0]+'</a>'+D.cat.map(function(c){return '<a href="#'+c.id+'">'+c[lang]+'</a>'}).join('');
  var html='',zona='';
  D.cat.forEach(function(c){
    if(c.seccion!==zona){zona=c.seccion;var z=L[zona==='frigobar'?'fr':'dp'];html+='<h2 class="zona" id="'+zona+'">'+z[0]+'<small>'+z[1]+'</small></h2>'}
    html+='<section id="'+c.id+'"><h2>'+c[lang]+'</h2>'+c.items.map(function(i){
      var q=cart[i.id]||0,name=eh(lang==='es'?i.es:i.en),note=eh(lang==='es'?i.nes:i.nen),itemId=eh(i.id);
      return '<div class="item"><div class="n"><div class="name">'+name+(i.tag?'<span class="tag">'+L[i.tag]+'</span>':'')+'</div>'+(note?'<div class="note">'+note+'</div>':'')+'</div>'
       +'<div class="price">'+fmt(i.p)+'</div><div class="qty">'+(q?'<button type="button" aria-label="−" data-m="'+itemId+'">−</button><span>'+q+'</span>':'')
       +'<button type="button" class="add" aria-label="+ '+name+'" data-p="'+itemId+'">+</button></div></div>'}).join('')+'</section>'});
  $('menu').innerHTML=html;bar();
}
function totals(){var n=0,s=0;all().forEach(function(i){var q=cart[i.id]||0;n+=q;s+=q*i.p});return{n:n,s:s}}
function bar(){var t=totals();$('cnt').textContent=T[lang].cnt(t.n);$('tot').textContent=fmt(t.s);$('go').textContent=T[lang].go;$('go').disabled=!t.n}
document.addEventListener('click',function(e){
  var p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');
  if(p){cart[p.dataset.p]=(cart[p.dataset.p]||0)+1;render()}
  if(m){cart[m.dataset.m]--;if(!cart[m.dataset.m])delete cart[m.dataset.m];render()}
});
function sheet(){
  var L=T[lang],t=totals();
  var lines=all().filter(function(i){return cart[i.id]}).map(function(i){return '<div><span>'+cart[i.id]+' × '+eh(lang==='es'?i.es:i.en)+'</span><span>'+fmt(cart[i.id]*i.p)+'</span></div>'}).join('');
  function opt(k){return '<button type="button" class="pay" data-pay="'+k+'" aria-pressed="'+(pay===k)+'"><b>'+L[k][0]+'</b><span>'+L[k][1]+'</span></button>'}
  var info='<div class="info">'+(pay==='airbnb'?L.iAirbnb:pay==='cash'?L.iCash:L.iXfer)+'</div>';
  $('sb').innerHTML='<div style="display:flex;flex-direction:column;gap:14px"><h3 id="sh-t">'+L.title+'</h3><div class="lines">'+lines+'<div class="sum"><span>'+L.total+'</span><span>'+fmt(t.s)+'</span></div></div><b>'+L.how+'</b><div class="pays">'+opt('airbnb')+opt('cash')+opt('xfer')+'</div>'+info+'<button type="button" class="cta" id="ok">'+L.confirm+'</button></div>';
  $('sb').querySelectorAll('[data-cuenta]').forEach(function(el){
    var i=+el.dataset.cuenta;el.textContent=D.pago[i];
    var b=document.createElement('button');b.type='button';b.className='copy';b.dataset.copy=i;
    b.textContent=L.copy;b.setAttribute('aria-label',L.copy+' '+L.copyLabels[i]);el.parentNode.parentNode.appendChild(b);
  });

  $('sheet').hidden=false;
}
async function copiarDato(b){
  var i=Number(b.dataset.copy),L=T[lang];if(!Number.isInteger(i)||i<0||i>2)return;
  var value=D.pago[i],ok=false;
  b.disabled=true;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(value);ok=true}}catch(e){}
  if(!ok){
    var field=document.createElement('textarea');field.value=value;field.readOnly=true;
    field.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(field);
    try{field.focus();field.select();field.setSelectionRange(0,value.length);ok=document.execCommand('copy')===true}catch(e){}finally{field.remove();b.focus()}
  }
  b.disabled=false;if(!b.isConnected)return;
  b.textContent=ok?L.copied:L.copy;var status=$('copy-status');if(status)status.textContent=ok?L.copyOK:L.copyFail;
  if(ok)setTimeout(function(){if(b.isConnected)b.textContent=T[lang].copy},2000);
}

  if(e.target.id==='ok'){var L=T[lang];$('sb').innerHTML='<div class="done"><h3>'+L.ok+'</h3><p>'+L.okTxt+'</p></div>';cart={};render()}
});
render();

</script>
